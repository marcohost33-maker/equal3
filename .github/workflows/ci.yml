name: ci

# Research record, release decision NO-GO. A green run shows that the listed
# tests pass on this runner; it does not change the NO-GO status (docs/ROADMAP.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHON_VERSION: "3.13"   # research environment: Python 3.13.5 (reports/misc/ENVIRONMENT_V077.json)

jobs:
  provenance:
    name: provenance (byte-identical import)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify imported files against PATH_MAPPING.tsv and MANIFEST_V0722.sha256
        run: python tools/verify_provenance.py
      - name: Test the provenance checker
        run: python -m unittest -v tools/test_verify_provenance.py
      - name: Test the test-group runner
        run: python -m unittest -v tools/test_run_test_groups.py
      - name: Test the SQLite runtime check
        run: python -m unittest -v tools/test_check_sqlite_runtime.py

  research-tests:
    # Groups, modules and the hang detector live in tools/run_test_groups.py (single source).
    # anchor_wire runs on every push/PR since 2026-10-27: it passed 10/10 in about 11 s on Linux
    # (verification/2026-10-27_linux/). A group over 300 s is killed and counts as a failure.
    # Without root, exactly the 4 separate-UID isolation tests may skip (by test id); the root
    # job below runs them. Dependencies install from a hash lock (tools/requirements-ci.lock).
    name: research test groups (non-root)
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install research dependency (hash-locked, wheels only)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r tools/requirements-ci.lock
      - name: All 12 groups, per-group counts as reported, only the 4 root-only tests may skip
        run: >
          python tools/run_test_groups.py --expect-total 430 --expect-reported
          --allow-skip test_writer_service_v0714.WriterBoundaryTests.test_untrusted_public_key_and_parent
          --allow-skip test_writer_service_v0714.WriterBoundaryTests.test_runtime_gate_called_at_startup_and_failclosed
          --allow-skip test_writer_service_v0714.WriterBoundaryTests.test_real_linux_uid_boundary_separate_client
          --allow-skip test_anchor_v079.GroupSocketIsolationTests.test_separate_uid_can_connect_but_cannot_read_anchor
          --json "$RUNNER_TEMP/test-groups-nonroot.json"
      - name: Negative control, the WAL-reset gate holds on the runner's unpatched system SQLite
        if: ${{ !cancelled() }}
        run: python tools/check_sqlite_runtime.py --expect-gate hold --json "$RUNNER_TEMP/sqlite-runtime-system.json"
      - name: Keep the evidence JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-groups-nonroot
          path: |
            ${{ runner.temp }}/test-groups-nonroot.json
            ${{ runner.temp }}/sqlite-runtime-system.json
          if-no-files-found: error
          retention-days: 90

  research-tests-root:
    # The separate-UID tests (writer v0.7.14 x3, anchor socket v0.7.9 x1) drop to UID 65534.
    # That UID cannot read $GITHUB_WORKSPACE under /home/runner, so the tree and a venv are
    # staged world-readable under /srv first. Here a skip is a failure.
    name: research test groups (root, separate-UID isolation)
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stage world-readable tree and venv
        run: |
          sudo install -d -m 0755 /srv/equal3
          sudo cp -r research tools /srv/equal3/
          sudo env "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "$(command -v python)" -m venv /srv/eq3venv
          sudo env "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" /srv/eq3venv/bin/python -m pip install --require-hashes --only-binary :all: -r tools/requirements-ci.lock
          sudo chmod -R a+rX /srv/equal3 /srv/eq3venv
      - name: All 12 groups as root, 430 tests, no skips allowed
        run: >
          sudo env "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "GITHUB_SHA=$GITHUB_SHA" PYTHONDONTWRITEBYTECODE=1
          /srv/eq3venv/bin/python /srv/equal3/tools/run_test_groups.py
          --research-dir /srv/equal3/research --require-no-skips --expect-total 430 --expect-reported
          --json "$RUNNER_TEMP/test-groups-root.json"
      - name: Keep the evidence JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-groups-root
          path: ${{ runner.temp }}/test-groups-root.json
          if-no-files-found: error
          retention-days: 90

  research-tests-sqlite-3541:
    # Roadmap P0-4: the full regression on an upstream-patched SQLite that the test processes
    # really map. Source: the official amalgamation from sqlite.org, checked by the unmodified
    # research builder against its SHA3-256 pins for the ZIP and for sqlite3.c (both also listed
    # by sqlite.org), compiled in an empty directory and smoke-tested in a new interpreter. The
    # library is then copied world-readable, because the dynamic loader silently skips a library
    # that UID 65534 cannot read and the UID-drop tests would fall back to the system SQLite.
    # Root, so the separate-UID tests run too. Not a signed build attestation; release stays NO-GO.
    name: research test groups on SQLite 3.54.1 built from official source (root)
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SQLITE_ZIP: sqlite-amalgamation-3540100.zip
      SQLITE_URL: https://www.sqlite.org/2026/sqlite-amalgamation-3540100.zip
      SQLITE_SOURCE_ID: "2026-10-16 14:45:20 555e07ef33f69a0957d24d8e555b702464a131d6f1607f4c3c1e4551e8e6ca76"
      SQLITE_LIB_DIR: /srv/sqlite-3.54.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download the official SQLite 3.54.1 amalgamation
        run: >
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --retry 3
          -o "$RUNNER_TEMP/$SQLITE_ZIP" "$SQLITE_URL"
      - name: Verify the SHA3-256 pins and build with the unmodified research builder
        working-directory: research
        run: python build_sqlite_v0711.py "$RUNNER_TEMP/$SQLITE_ZIP" "$RUNNER_TEMP/sqlite-build"
      - name: Stage world-readable tree, venv and library
        run: |
          sudo install -d -m 0755 /srv/equal3 "$SQLITE_LIB_DIR"
          sudo cp -r research tools /srv/equal3/
          sudo install -m 0644 "$RUNNER_TEMP/sqlite-build/libsqlite3.so.0" "$SQLITE_LIB_DIR/libsqlite3.so.0"
          sudo env "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "$(command -v python)" -m venv /srv/eq3venv
          sudo env "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" /srv/eq3venv/bin/python -m pip install --require-hashes --only-binary :all: -r tools/requirements-ci.lock
          sudo chmod -R a+rX /srv/equal3 /srv/eq3venv
          cp "$RUNNER_TEMP/sqlite-build/build_evidence.json" "$RUNNER_TEMP/sqlite-build-evidence.json"
          echo "SQLITE_LIB_SHA256=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["shared_library_sha256"])' "$RUNNER_TEMP/sqlite-build-evidence.json")" >> "$GITHUB_ENV"
      - name: SQLite 3.54.1 is the mapped library and the WAL-reset gate opens without override
        run: >
          sudo env "LD_LIBRARY_PATH=$SQLITE_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          /srv/eq3venv/bin/python /srv/equal3/tools/check_sqlite_runtime.py --expect-gate open
          --expect-version 3.54.1 --expect-source-id "$SQLITE_SOURCE_ID"
          --expect-library "$SQLITE_LIB_DIR/libsqlite3.so.0" --expect-library-sha256 "$SQLITE_LIB_SHA256"
          --json "$RUNNER_TEMP/sqlite-runtime-3.54.1.json"
      - name: All 12 groups as root on SQLite 3.54.1, 430 tests, no skips allowed
        run: >
          sudo env "LD_LIBRARY_PATH=$SQLITE_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "GITHUB_SHA=$GITHUB_SHA" PYTHONDONTWRITEBYTECODE=1
          /srv/eq3venv/bin/python /srv/equal3/tools/run_test_groups.py
          --research-dir /srv/equal3/research --require-no-skips --expect-total 430 --expect-reported
          --expect-sqlite 3.54.1 --json "$RUNNER_TEMP/test-groups-sqlite-3.54.1.json"
      - name: Keep the evidence JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-3.54.1
          path: |
            ${{ runner.temp }}/sqlite-build-evidence.json
            ${{ runner.temp }}/sqlite-runtime-3.54.1.json
            ${{ runner.temp }}/test-groups-sqlite-3.54.1.json
          if-no-files-found: error
          retention-days: 90
